<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable variant: full-bleed amber, no rounded corners, because the OS
       applies its own mask (a circle or squircle) and a pre-rounded icon gets
       rounded twice. The "H" sits inside the 80 % safe zone so no mask crops
       it. -->
  <rect width="512" height="512" fill="#f59e0b"/>
  <g fill="#ffffff">
    <rect x="150" y="140" width="60" height="232" rx="12"/>
    <rect x="302" y="140" width="60" height="232" rx="12"/>
    <rect x="150" y="226" width="212" height="60" rx="12"/>
  </g>
</svg>
